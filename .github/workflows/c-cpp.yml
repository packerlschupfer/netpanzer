name: Linux
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

on:
  push:
    branches: master
    paths:
    - 'src/**/**'
    - 'support/**/*.cpp'
    - '**meson.build'
    - 'setup-build.*'
    - 'subprojects/*.wrap'
    - '**/c-cpp.yml'
  pull_request:
    branches: master
    paths:
    - 'src/**/**'
    - 'support/**/*.cpp'
    - 'setup-build.*'
    - '**meson.build'
    - 'subprojects/*.wrap'
    - '**/c-cpp.yml'

jobs:
  build:
    name: ${{ matrix.name }}-Ubuntu-${{ matrix.ubuntu }}-${{ matrix.cc }}
    strategy:
      # One failing entry used to cancel the other eleven, so a single broken
      # cross build hid whether any native build worked. Every entry reports
      # for itself now.
      fail-fast: false
      matrix:
        name: [standard]
        # 20.04 supported until >= April 2025
        ubuntu: [20.04, 22.04, 24.04]
        cc: [gcc, clang]
        include:
          - name: with-lto
            ubuntu: latest
            options: '-Db_lto=true'
          # Sanitizers used to be in the project's default_options, which meant
          # every build including releases paid for them. They are opt-in now,
          # so one job has to ask for them explicitly.
          - name: sanitizers
            ubuntu: latest
            options: '-Db_sanitize=address,undefined'
          - name: data-install-test
            ubuntu: 22.04
          - name: no-deps
            ubuntu: 22.04
          - name: cross-aarch64
            ubuntu: 22.04
            cross-file: 'support/cross/aarch64-linux-gcc.txt'
          - name: cross-x86_64-w64-mingw32
            ubuntu: 22.04
            cross-file: 'support/cross/x86_64-w64-mingw32.txt'

    runs-on: ubuntu-${{ matrix.ubuntu }}
    env:
      MESON_OPTS: '_build'
      NETPANZER_DATADIR: ${{ github.workspace }}/data
      INST_PREFIX_DIR: ${{ github.workspace }}/inst_test
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Prepare variables
      run: |
        if [ "${{ matrix.cc }}" = "gcc" ] || [ -z "${{ matrix.cc }}" ]; then
          CC=gcc
          CXX=g++
        else
          CC=clang
          CXX=clang++
        fi
        echo "CC=$CC" >> $GITHUB_ENV
        echo "CXX=$CXX" >> $GITHUB_ENV
        echo "want_nls=${{ ! contains(matrix.name, 'no-deps') }}" >> $GITHUB_ENV

    - name: Show info
      run: |
        export -p
        echo '${{ toJSON(matrix) }}'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt remove -y firefox # save a little time during upgrade
        sudo apt install -y \
          python3 \
          python3-setuptools
        # meson comes from pip on every runner, not just 20.04. The SDL
        # wraps need a newer meson than Ubuntu 22.04's 0.61, so the no-deps
        # job -- the one that actually builds SDL from the wrap -- could not
        # configure it.
        sudo apt install -y python3-pip
        python -m pip install --upgrade pip
        pip install meson ninja
        if [ -n "${{ matrix.cross-file }}" ]; then
          if [ "${{ contains(matrix.cross-file, 'linux') }}" == "true" ]; then
            # Cross-compiling to aarch64. The SDL3 wrap needs udev, dbus,
            # wayland, xkbcommon and EGL *for the target*, so amd64 copies of
            # them are no use -- arm64 has to be enabled as a foreign
            # architecture and the packages pulled from ports.ubuntu.com,
            # which is where Ubuntu keeps non-x86 builds.
            sudo dpkg --add-architecture arm64
            codename=$(lsb_release -cs)
            # Every existing entry has to be pinned to amd64 first, or apt
            # looks for arm64 indexes on archives that do not carry them and
            # apt update fails. Two source formats are in play: classic
            # one-line .list files and deb822 .sources files. Entries that
            # already carry options are left alone -- rewriting those would
            # drop their signed-by keys.
            sudo find /etc/apt -name '*.list' -exec sed -i -E '/^deb /{/\[/!s|^deb |deb [arch=amd64] |}' {} +
            sudo find /etc/apt -name '*.sources' -exec sh -c 'grep -q "^Architectures:" "$1" || printf "Architectures: amd64\n" | sudo tee -a "$1" >/dev/null' _ {} \;
            printf 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports %s main universe\ndeb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports %s-updates main universe\ndeb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports %s-security main universe\n' "$codename" "$codename" "$codename" | sudo tee /etc/apt/sources.list.d/arm64-ports.list
            echo "--- apt sources after pinning ---"
            grep -rh '^deb ' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null || true
            sudo apt update
            sudo apt install -y \
              g++-aarch64-linux-gnu \
              gettext \
              libc6-dev-arm64-cross \
              wayland-protocols \
              liblua5.4-dev:arm64 \
              libphysfs-dev:arm64 \
              libudev-dev:arm64 \
              libdbus-1-dev:arm64 \
              libwayland-dev:arm64 \
              libxkbcommon-dev:arm64 \
              libegl-dev:arm64 \
              libasound2-dev:arm64 \
              libpulse-dev:arm64
            # This release has no pkg-config-aarch64-linux-gnu, so supply the
            # wrapper the cross file names: plain pkg-config pointed at the
            # arm64 multiarch directories, which is all the packaged one does.
            printf '#!/bin/sh\nexport PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig\nexec pkg-config "$@"\n' | sudo tee /usr/local/bin/aarch64-linux-gnu-pkg-config >/dev/null
            sudo chmod +x /usr/local/bin/aarch64-linux-gnu-pkg-config
            aarch64-linux-gnu-pkg-config --list-all | head -5
          else
            # When using the mingw-w64 from Ubuntu Jammy, the SDL build fails
            # fatal error: d3d12sdklayers.h: No such file or directory
            # I found a discussion and fix at https://github.com/doitsujin/dxvk/issues/3328
            sudo apt purge --autoremove mingw-w64
            sudo apt install -y wget
            wget https://github.com/mstorsjo/llvm-mingw/releases/download/20230320/llvm-mingw-20230320-ucrt-ubuntu-18.04-x86_64.tar.xz
            tar xf llvm-mingw-20230320-ucrt-ubuntu-18.04-x86_64.tar.xz
            PATH="$PWD/llvm-mingw-20230320-ucrt-ubuntu-18.04-x86_64/bin:$PATH" LD_LIBRARY_PATH="$PWD/llvm-mingw-20230320-ucrt-ubuntu-18.04-x86_64/lib"
            echo "PATH=${PATH}" >> $GITHUB_ENV
            echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> $GITHUB_ENV
          fi
        fi

    # The no-deps job builds every wrappable dependency from source, but the
    # SDL3 wrap still needs these from the system: there is no wrap for udev,
    # dbus, wayland or EGL, and without them it cannot configure at all.
    - if: ${{ contains(matrix.name, 'no-deps') }}
      run: |
        sudo apt install -y \
          libudev-dev \
          libdbus-1-dev \
          libwayland-dev \
          wayland-protocols \
          libxkbcommon-dev \
          libegl-dev \
          libasound2-dev \
          libpulse-dev

    - if: ${{ ! contains(matrix.name, 'no-deps') }}
      run: |
        sudo apt install -y \
          gettext \
          liblua5.4-dev \
          libphysfs-dev \
          libudev-dev \
          libdbus-1-dev \
          libwayland-dev \
          wayland-protocols \
          libxkbcommon-dev \
          libegl-dev \
          libasound2-dev \
          libpulse-dev

    - name: Setup
      run: |
        MESON_OPTS="$MESON_OPTS -Dprefix=$INST_PREFIX_DIR -Dnls=$want_nls"
        if [ -n "${{ matrix.cross-file }}" ]; then
          # Sanitizers are off by default now, so nothing to disable here; the
          # ASAN runtime for other architectures would not be available anyway.
          # https://github.com/google/sanitizers/wiki/AddressSanitizer
          MESON_OPTS="$MESON_OPTS --cross-file ${{ matrix.cross-file }}"
        fi
        ./setup-build.sh $MESON_OPTS ${{ matrix.options }}

    - name: Meson build
      run: ninja -C _build

    - if: ${{ contains(matrix.cross-file, 'w64') }}
      run: test -f _build/netpanzer.exe

    - name: Test
      run: |
        # cross builds won't run on an amd64 runner without emulation
        if [ -z "${{ matrix.cross-file }}" ]; then
          cd _build
          meson test --suite=netpanzer -v
        fi

    - name: Data install test
      if: ${{ contains(matrix.name, 'data-install-test') }}
      run: |
        unset NETPANZER_DATADIR
        cd _build
        # want fail
        $GITHUB_WORKSPACE/tests/test_data_install.sh || true
        meson install --skip-subprojects
        cd $INST_PREFIX_DIR/bin
        # want pass
        $GITHUB_WORKSPACE/tests/test_data_install.sh
