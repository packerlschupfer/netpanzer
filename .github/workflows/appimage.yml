name: Build AppImage
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'version number'
        required: true
        type: string
  schedule:
    - cron: '30 09 * * 5'
  pull_request:
    branches: master
    paths:
    - '**/appimage.yml'
    - 'support/appimage/**'

env:
  VERSION: ${{ inputs.version }}

jobs:
  build-appimage:
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every architecture rather than cancelling the rest on the
      # first failure.
      fail-fast: false
      matrix:
        # Native runners rather than qemu. arm/v7 is gone: the linuxdeploy
        # image publishes amd64 and arm64 manifests only, and SDL3 does not
        # assemble on 32-bit ARM here anyway ("thumb conditional instruction
        # should be in IT block" from its own atomic code). Source builds via
        # support/cross/ remain available for that case.
        os:
          - ubuntu-24.04        # native amd64
          - ubuntu-24.04-arm    # native arm64
    steps:
    - name: Set version
      run: |
        # If run from cron and not by dispatch, the version won't be set...
        if [ -z "$VERSION" ]; then
          VERSION="$(echo ${GITHUB_SHA} | head -c 7)-$(date +%y%m%d%H%M)"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
        fi

    - name: Checkout
      uses: actions/checkout@v4

    - name: Build AppImage
      # Container docs: https://github.com/andy5995/linuxdeploy-build-helper-container
      run: docker compose -f support/appimage/docker-compose.yml run --rm build

    - name: Create sha256sum
      run: |
        IMAGE_FILENAME=$(basename `find out/*AppImage`)
        echo "IMAGE_FILENAME=$IMAGE_FILENAME" >> $GITHUB_ENV
        cd out
        sha256sum "$IMAGE_FILENAME" > "$IMAGE_FILENAME.sha256sum"

    - if: ${{ github.ref == 'refs/heads/master' }}
      name: Release AppImage
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true
        artifactErrorsFailBuild: true
        name: NetPanzer Weekly AppImage (Unstable)
        prerelease: true
        draft: false
        artifacts: ./out/*
        token: ${{ secrets.GITHUB_TOKEN }}
        omitBody: true
        omitBodyDuringUpdate: true
        omitNameDuringUpdate: true
        tag: appimage-weekly
        # Only the amd64 job clears stale artifacts, so it does not delete
        # the arm64 job's upload afterwards.
        removeArtifacts: ${{ matrix.os == 'ubuntu-24.04' }}

    - if: ${{ github.ref != 'refs/heads/master' }}
      name: Upload AppImage
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.IMAGE_FILENAME }}
        path: ./out/*
        if-no-files-found: error
