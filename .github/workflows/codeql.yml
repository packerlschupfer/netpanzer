name: CodeQL
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

on:
  push:
    branches: master
    paths:
    - 'src/**/**'
    - 'support/**/*.cpp'
    - '**/codeql.yml'
  pull_request:
    paths:
    - 'src/**/**'
    - '**/codeql.yml'

jobs:
  codeql:
    runs-on: ubuntu-22.04
    # The analysis itself ran fine; uploading its results failed with
    # "Resource not accessible by integration" because the job had only the
    # default read-only token. Uploading to code scanning needs this.
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          gettext \
          liblua5.4-dev \
          libphysfs-dev \
          libudev-dev \
          libdbus-1-dev \
          libwayland-dev \
          wayland-protocols \
          libxkbcommon-dev \
          libegl-dev \
          libasound2-dev \
          libpulse-dev \
          ninja-build \
          python3 \
          python3-setuptools
        # meson from pip, not apt: the SDL3 wrap needs >= 1.6 and
        # Ubuntu 22.04 ships 0.61.
        sudo apt install -y python3-pip
        python3 -m pip install --upgrade pip
        pip install meson ninja

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: 'cpp'

    - name: Meson build
      run: |
        meson setup _build
        ninja -v -C _build

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
