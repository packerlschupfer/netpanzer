env:
  NETPANZER_DATADIR: $CIRRUS_WORKING_DIR/data

# Define a template for tasks
filter_template: &filter_template
  only_if: "changesInclude(
    'src/**/**',
    '**meson.build',
    'setup-build.*',
    'subprojects/*.wrap',
    '.cirrus.yml'
    )"

freebsd_task:
  <<: *filter_template
  name: FreeBSD 14.1
  freebsd_instance:
    image_family: freebsd-14-1
  pkginstall_script:
    - pkg update -f
    # No sdl3_mixer port exists yet; that one comes from the wrap.
    - pkg install -y gettext meson ninja physfs pkgconf sdl3 sdl3_ttf
  setup_script:
  - ./setup-build.sh _build
  build_script:
  - cd _build && ninja
  test_script:
  - cd _build && meson test --suite=netpanzer -v

arm_task:
  <<: *filter_template
  name: Ubuntu arm64
  arm_container:
    image: ghcr.io/netpanzer/netpanzer:build-env-latest
  setup_script:
  - ./setup-build.sh _build
  build_script:
  - cd _build && ninja
  test_script:
  - cd _build && meson test --suite=netpanzer -v

macos_task:
  <<: *filter_template
  name: macOS arm64
  macos_instance:
    image: ghcr.io/cirruslabs/macos-runner:sonoma
  pkginstall_script:
    - brew update
    - brew install gettext meson ninja physfs sdl3 sdl3_ttf sdl3_mixer
    # Make sure msgfmt is on PATH so the translations get built; older gettext
    # formulas were keg-only. Harmless when it is already linked. Meson locates
    # libintl on its own either way.
    - brew unlink gettext && brew link gettext --force
  setup_script:
  - ./setup-build.sh _build
  build_script:
  - cd _build && ninja
  test_script:
  - cd _build && meson test --suite=netpanzer -v
